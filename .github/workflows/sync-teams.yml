name: Sync Teams

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization name'
        required: true
        type: string
      config-path:
        description: 'Path to teams config file'
        required: false
        default: '.github/teams.yaml'
        type: string
      dry-run:
        description: 'Run in dry-run mode'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  push:
    branches:
      - main
    paths:
      - '.github/teams.yaml'
      - '.github/workflows/sync-teams.yml'
      - 'scripts/sync-teams.ts'
  pull_request:
    branches:
      - main
    paths:
      - '.github/teams.yaml'
      - '.github/workflows/sync-teams.yml'
      - 'scripts/sync-teams.ts'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Security audit
        run: npm audit --audit-level=high

  sync:
    name: Sync Teams
    # Org mutation requires GH_ORG_TOKEN; skip on PRs (validate still runs)
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build action
        run: npm run build
      - name: Run team sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
        run: node dist/sync-teams.js --config=${{ github.event.inputs.config-path || '.github/teams.yaml' }} --dry-run=${{ github.event.inputs.dry-run || 'false' }} --org=${{ github.event.inputs.org || github.repository_owner }}
